<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Disponibilités — Mahé Richard-Schmidt</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&family=Outfit:wght@100;200&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a09; --white: #f0ede8; --muted: #55554f;
      --accent: #c8b89a; --line: #1e1e1c;
      --dispo: #7a9b6e; --occupe: #c17a4e; --weekend: #8a7ca0; --past: #2b2b28; --empty: var(--bg);
      /* fonds plus saturés, réservés aux cases de la vue mensuelle */
      --dispo-wash: rgba(111,175,82,.32); --occupe-wash: rgba(210,108,58,.30); --weekend-wash: rgba(134,98,178,.30);
    }
    body {
      background: var(--bg); color: var(--white);
      font-family: 'DM Mono', monospace; cursor: none;
      min-height: 100vh;
    }
    :focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

    /* ── Curseur — identique au site principal ── */
    #cursor {
      position: fixed; z-index: 9999; pointer-events: none;
      mix-blend-mode: difference; left: -80px; top: -80px;
      transform: translate(-50%, -50%); width: 36px; height: 36px;
    }
    #cursor::before, #cursor::after {
      content: ""; position: absolute; top: 50%; left: 50%;
      width: 32px; height: 2px; background: rgba(255,255,255,0.95);
      transform-origin: center;
    }
    #cursor::before { transform: translate(-50%, -50%) rotate(45deg); }
    #cursor::after  { transform: translate(-50%, -50%) rotate(-45deg); }

    /* ── Header — identique au site principal ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px; height: 64px;
      border-bottom: 1px solid var(--line);
    }
    .hdr-name {
      font-family: 'Outfit', sans-serif; font-weight: 100;
      font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; color: var(--accent);
    }
    .hdr-role { font-size: .56rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
    .back-link {
      font-size: .58rem; letter-spacing: .14em; text-transform: uppercase;
      color: var(--muted); text-decoration: none; transition: color .2s;
      display: flex; align-items: center; gap: 10px; cursor: none;
    }
    .back-link:hover { color: var(--white); }
    .back-link::before { content: '←'; font-size: .9rem; }

    /* ── Contenu ── */
    main { max-width: 760px; margin: 0 auto; padding: 88px 32px 72px; }
    .eyebrow {
      font-size: .58rem; letter-spacing: .16em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 18px;
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      letter-spacing: .04em; line-height: .95;
      color: var(--white); margin-bottom: 22px;
    }
    .intro { display: none; }

    /* ── Légende + toggle sur une ligne ── */
    .legend-row {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px; margin-bottom: 28px;
    }
    .legend { display: flex; gap: 22px; flex-wrap: wrap; }
    .legend-item {
      display: flex; align-items: center; gap: 9px;
      font-size: .56rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted);
    }
    .swatch { width: 11px; height: 11px; flex-shrink: 0; }
    .swatch.dispo   { background: var(--dispo); }
    .swatch.occupe  { background: var(--occupe); }
    .swatch.weekend { background: var(--weekend); }
    .swatch.past    { background: var(--past); border: 1px solid var(--line); }

    /* ── Toggle mois / année ── */
    .view-toggle { display: flex; gap: 8px; }
    .view-btn {
      background: none; border: 1px solid var(--line); color: var(--muted);
      padding: 9px 18px; cursor: none;
      font-family: 'DM Mono', monospace; font-size: .58rem;
      letter-spacing: .12em; text-transform: uppercase;
      transition: color .2s ease, border-color .2s ease;
    }
    .view-btn:hover { color: var(--white); }
    .view-btn.active { color: var(--white); border-color: var(--accent); }

    /* ── Navigation mois ── */
    .cal-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    #cal-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem; letter-spacing: .06em;
    }
    .nav-btn {
      background: none; border: 1px solid var(--line); color: var(--white);
      width: 34px; height: 34px; cursor: none;
      font-family: 'DM Mono', monospace; font-size: .9rem;
      transition: border-color .2s ease, color .2s ease;
    }
    .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
    .nav-btn:disabled { opacity: .25; cursor: default; }
    .nav-btn:disabled:hover { border-color: var(--line); color: var(--white); }

    /* ── Grille calendrier ── */
    .weekdays {
      display: grid; grid-template-columns: repeat(7, 1fr);
      border-top: 1px solid var(--line); border-left: 1px solid var(--line);
    }
    .weekdays div {
      padding: 10px 0; text-align: center;
      font-size: .56rem; letter-spacing: .12em; text-transform: uppercase;
      color: var(--muted);
      border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    }
    .grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      border-left: 1px solid var(--line);
    }
    .day {
      aspect-ratio: 1 / 0.85; min-height: 56px;
      border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
      padding: 8px; position: relative;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .day .num { font-size: .68rem; color: var(--white); }
    .day .status {
      font-size: .48rem; letter-spacing: .08em; text-transform: uppercase;
    }
    .day.dispo   { background: var(--dispo-wash); }
    .day.dispo   .status { color: var(--dispo); }
    .day.occupe  { background: var(--occupe-wash); }
    .day.occupe  .status { color: var(--occupe); }
    .day.weekend { background: var(--weekend-wash); }
    .day.weekend .status { color: var(--weekend); }
    .day.past    { background: var(--past); }
    .day.past .num { color: var(--muted); }
    .day.empty   { background: var(--empty); border-right-color: var(--line); }

    /* ── Vue annuelle ── */
    .year-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 32px 22px;
    }
    .mini-month h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: .8rem; letter-spacing: .06em;
      margin-bottom: 8px; color: var(--white);
    }
    .mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .mini-day { aspect-ratio: 1 / 1; }
    .mini-day.dispo   { background: var(--dispo); }
    .mini-day.occupe  { background: var(--occupe); }
    .mini-day.weekend { background: var(--weekend); }
    .mini-day.past    { background: var(--past); }
    .mini-day.empty   { background: transparent; }

    @media (max-width: 620px) {
      .year-grid { grid-template-columns: repeat(2, 1fr); gap: 26px 16px; }
    }
    @media (max-width: 400px) {
      .year-grid { grid-template-columns: 1fr; }
    }

    /* ── Infobulle personnalisée (vue annuelle) ── */
    .day-tooltip {
      position: fixed; z-index: 10000; pointer-events: none;
      background: #100f0d; color: var(--white); border: 1px solid var(--line);
      font-family: 'DM Mono', monospace; font-size: .62rem; letter-spacing: .04em;
      padding: 7px 12px; white-space: nowrap;
      opacity: 0; transform: translate(-50%, -130%);
      transition: opacity .06s ease;
    }
    .day-tooltip.visible { opacity: 1; }

    /* ── CTA ── */
    .cta {
      display: inline-flex; align-items: center; gap: 16px;
      margin-top: 40px; padding: 18px 30px;
      border: 1px solid var(--line); background: transparent;
      color: var(--white); text-decoration: none; cursor: none;
      font-family: 'DM Mono', monospace;
      font-size: .64rem; letter-spacing: .16em; text-transform: uppercase;
      transition: border-color .25s ease, background .25s ease;
    }
    .cta:hover { border-color: var(--accent); background: rgba(200,184,154,.06); }
    .cta::after { content: '→'; font-size: 1rem; transition: transform .25s ease; }
    .cta:hover::after { transform: translateX(4px); }

    @media (max-width: 560px) {
      header { padding: 0 24px; }
      main { padding: 64px 20px 48px; }
      .day { min-height: 44px; padding: 6px; }
      .day .num { font-size: .6rem; }
      .day .status { font-size: .4rem; }
      .weekdays div { font-size: .48rem; padding: 6px 0; }
    }
  </style>
</head>
<body>

<div id="cursor"></div>

<header>
  <div>
    <div class="hdr-name">Mahé Richard-Schmidt</div>
    <div class="hdr-role">Monteur vidéo</div>
  </div>
  <a href="/" class="back-link">Retour au site</a>
</header>

<main>
  <div class="eyebrow">Réservation</div>
  <h1>Disponibilités</h1>
  <div class="legend-row">
    <div class="legend">
      <div class="legend-item"><span class="swatch dispo"></span>Disponible</div>
      <div class="legend-item"><span class="swatch occupe"></span>Occupé</div>
      <div class="legend-item"><span class="swatch weekend"></span>Week-end</div>
      <div class="legend-item"><span class="swatch past"></span>Passé</div>
    </div>
    <div class="view-toggle">
      <button class="view-btn active" id="view-month">Mois</button>
      <button class="view-btn" id="view-year">Année</button>
    </div>
  </div>

  <div class="cal-nav">
    <button class="nav-btn" id="prev" aria-label="Précédent">←</button>
    <div id="cal-title"></div>
    <button class="nav-btn" id="next" aria-label="Suivant">→</button>
  </div>

  <div class="weekdays" id="weekdays-row">
    <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="year-grid" id="year-grid" style="display:none;"></div>

  <a class="cta" href="mailto:maherichardschmidt@gmail.com">Me contacter</a>
</main>

<script>
// ═══════════════════════════════════════════════════════════════
//  JOURS OCCUPÉS — modifie uniquement ce tableau
//  Format : 'AAMMJJ' (2 chiffres année, 2 mois, 2 jour).
//  Ex : '261010' = 10 octobre 2026. Tout le reste (dispo / week-end)
//  est calculé automatiquement.
// ═══════════════════════════════════════════════════════════════
const OCCUPE = [
  '261001','261002','261003','261004',
  '261010','261011',
  '261012','261013','261014','261015','261016',
];
// ═══════════════════════════════════════════════════════════════

const MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

// ── Curseur ──
const cursor = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top  = e.clientY + 'px';
});

// ── Infobulle (vue annuelle) — instantanée, suit la souris, tap sur mobile ──
const tooltip = document.createElement('div');
tooltip.className = 'day-tooltip';
document.body.appendChild(tooltip);

function showTooltip(x, y, text) {
  tooltip.textContent = text;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
  tooltip.classList.add('visible');
}
function moveTooltip(x, y) {
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}
function hideTooltip() {
  tooltip.classList.remove('visible');
}

const today = new Date();
today.setHours(0,0,0,0);

let view      = 'month'; // 'month' | 'year'
let viewYear  = today.getFullYear();
let viewMonth = today.getMonth();

// Fenêtre glissante de 12 mois pour la vue "Année" — démarre toujours au mois
// actuel (ex : septembre 2026 → août 2027), jamais de mois passés inutiles.
let yearStart = { year: today.getFullYear(), month: today.getMonth() };

function addMonths({ year, month }, delta) {
  const total = month + delta;
  return { year: year + Math.floor(total / 12), month: ((total % 12) + 12) % 12 };
}

const gridEl      = document.getElementById('grid');
const yearGridEl  = document.getElementById('year-grid');
const weekdaysRow = document.getElementById('weekdays-row');
const titleEl     = document.getElementById('cal-title');
const prevBtn     = document.getElementById('prev');
const nextBtn     = document.getElementById('next');
const viewMonthBtn = document.getElementById('view-month');
const viewYearBtn  = document.getElementById('view-year');

function toKey(y, m, d) {
  return `${String(y).slice(-2)}${String(m + 1).padStart(2, '0')}${String(d).padStart(2, '0')}`;
}
function toLabel(y, m, d) {
  return `${String(d).padStart(2, '0')}/${String(m + 1).padStart(2, '0')}/${y}`;
}

// Calcule le statut de chaque jour d'un mois donné — utilisé par les deux vues
function buildMonthDays(year, month) {
  const firstOfMonth  = new Date(year, month, 1);
  const daysInMonth   = new Date(year, month + 1, 0).getDate();
  const leadingBlanks = (firstOfMonth.getDay() + 6) % 7; // Lundi = 0

  const days = [];
  for (let d = 1; d <= daysInMonth; d++) {
    const date  = new Date(year, month, d);
    const key   = toKey(year, month, d);
    const isPast   = date < today;
    const isWknd   = date.getDay() === 0 || date.getDay() === 6;
    const isBooked = OCCUPE.includes(key);

    let status, cls;
    if (isPast)        { cls = 'past';    status = ''; }
    else if (isBooked) { cls = 'occupe';  status = 'Occupé'; }
    else if (isWknd)   { cls = 'weekend'; status = 'Week-end'; }
    else                { cls = 'dispo';   status = 'Dispo'; }

    days.push({ day: d, key, label: toLabel(year, month, d), cls, status });
  }
  const trailingBlanks = (7 - ((leadingBlanks + days.length) % 7)) % 7;
  return { leadingBlanks, trailingBlanks, days };
}

function renderMonthView() {
  hideTooltip();
  weekdaysRow.style.display = '';
  gridEl.style.display = '';
  yearGridEl.style.display = 'none';

  titleEl.textContent = `${MOIS[viewMonth]} ${viewYear}`;
  gridEl.innerHTML = '';

  const { leadingBlanks, trailingBlanks, days } = buildMonthDays(viewYear, viewMonth);

  for (let i = 0; i < leadingBlanks; i++) {
    const cell = document.createElement('div');
    cell.className = 'day empty';
    gridEl.appendChild(cell);
  }
  days.forEach(({ day, cls, status }) => {
    const cell = document.createElement('div');
    cell.className = `day ${cls}`;
    cell.innerHTML = `<div class="num">${day}</div><div class="status">${status}</div>`;
    gridEl.appendChild(cell);
  });
  for (let i = 0; i < trailingBlanks; i++) {
    const cell = document.createElement('div');
    cell.className = 'day empty';
    gridEl.appendChild(cell);
  }

  prevBtn.disabled = viewYear === today.getFullYear() && viewMonth === today.getMonth();
}

function renderYearView() {
  hideTooltip();
  weekdaysRow.style.display = 'none';
  gridEl.style.display = 'none';
  yearGridEl.style.display = 'grid';

  const last = addMonths(yearStart, 11);
  titleEl.textContent = `${MOIS[yearStart.month]} ${yearStart.year} – ${MOIS[last.month]} ${last.year}`;
  yearGridEl.innerHTML = '';

  for (let i = 0; i < 12; i++) {
    const { year, month } = addMonths(yearStart, i);
    const { leadingBlanks, days } = buildMonthDays(year, month);

    const monthEl = document.createElement('div');
    monthEl.className = 'mini-month';
    monthEl.innerHTML = `<h3>${MOIS[month]} ${year}</h3>`;

    const miniGrid = document.createElement('div');
    miniGrid.className = 'mini-grid';

    for (let b = 0; b < leadingBlanks; b++) {
      const cell = document.createElement('div');
      cell.className = 'mini-day empty';
      miniGrid.appendChild(cell);
    }
    days.forEach(({ label, cls, status }) => {
      const cell = document.createElement('div');
      cell.className = `mini-day ${cls}`;
      const text = status ? `${label} — ${status}` : label;
      cell.addEventListener('mouseenter', e => showTooltip(e.clientX, e.clientY, text));
      cell.addEventListener('mousemove',  e => moveTooltip(e.clientX, e.clientY));
      cell.addEventListener('mouseleave', hideTooltip);
      cell.addEventListener('click', e => {
        showTooltip(e.clientX, e.clientY, text);
        clearTimeout(cell._tt);
        cell._tt = setTimeout(hideTooltip, 2000);
      });
      miniGrid.appendChild(cell);
    });

    monthEl.appendChild(miniGrid);
    yearGridEl.appendChild(monthEl);
  }

  prevBtn.disabled = yearStart.year === today.getFullYear() && yearStart.month === today.getMonth();
}

function render() {
  if (view === 'month') renderMonthView();
  else renderYearView();
}

prevBtn.addEventListener('click', () => {
  if (view === 'month') {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  } else {
    yearStart = addMonths(yearStart, -12);
  }
  render();
});
nextBtn.addEventListener('click', () => {
  if (view === 'month') {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  } else {
    yearStart = addMonths(yearStart, 12);
  }
  render();
});

viewMonthBtn.addEventListener('click', () => {
  view = 'month';
  viewMonthBtn.classList.add('active');
  viewYearBtn.classList.remove('active');
  render();
});
viewYearBtn.addEventListener('click', () => {
  view = 'year';
  viewYearBtn.classList.add('active');
  viewMonthBtn.classList.remove('active');
  render();
});

render();
</script>
</body>
</html>
